services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      AUTH_ENABLED: true
      STATIC_PATH: public
      JWT_SECRET: ${JWT_SECRET}
      SESSION_SECRET: ${SESSION_SECRET}
      MONGODB_URI: mongodb://mongo:27017/expresshillel
    command: npm run dev
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - mongo
    restart: unless-stopped

  mongo:
    image: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
